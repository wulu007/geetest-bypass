name: Publish Package

on:
  push:
    tags: ["*-v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Resolve the extension package from the tag
        id: pkg
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="${REF_NAME%-v*}"
          TAG_VER="${REF_NAME##*-v}"
          PKG="wulu-geetest-bypass-${NAME}"
          PKG_VER="$(uv version --short --package "$PKG")"
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "::error::Tag version ($TAG_VER) does not match $PKG version ($PKG_VER)."
            exit 1
          fi
          echo "dir=extensions/${PKG}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build "${{ steps.pkg.outputs.dir }}"

      - name: Publish to PyPI
        run: uv publish
