name: Update Config

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Update config
        id: update
        run: node scripts/extract-config.mjs

      - name: Bump version
        if: steps.update.outputs.CHANGED == 'true'
        id: bump
        run: |
          uv version --bump patch
          echo "version=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.update.outputs.CHANGED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update geetest config to ${{ steps.update.outputs.GEETEST_VER }} [auto]"
          file_pattern: 'src/wulu_geetest_bypass/data/*.json pyproject.toml uv.lock'
          commit_user_name: 'bot'
          commit_user_email: 'dabaobeix@gmail.com'
          tagging_message: 'v${{ steps.bump.outputs.version }}'
