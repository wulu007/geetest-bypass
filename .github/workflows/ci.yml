name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Lint and Format (Ruff)
        run: |
          uvx ruff check
          uvx ruff format --check

  publish:
    needs: lint
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Verify Version Match
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PROJECT_VER="$(uv version --short)"
          echo "Tag version: $TAG_VER"
          echo "Project version: $PROJECT_VER"
          if [[ "$TAG_VER" != "$PROJECT_VER" ]]; then
            echo "::error::Tag ($TAG_VER) does not match pyproject.toml version ($PROJECT_VER)!"
            exit 1
          fi

      - name: Clean and Build
        run: |
          rm -rf dist/
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Check if Pre-release
        id: check_pre
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if [[ "$VERSION" =~ [._-]?(a|b|rc|alpha|beta|dev)[0-9]*$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: ${{ steps.git_cliff.outputs.content }}
          prerelease: ${{ steps.check_pre.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.check_pre.outputs.make_latest == 'true' }}
