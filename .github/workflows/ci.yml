name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Lint and Format (Ruff)
        run: |
          uvx ruff check
          uvx ruff format --check

  publish:
    needs: lint
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Verify Version Match
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PROJECT_VER="$(uv version --short)"
          echo "Tag version: $TAG_VER"
          echo "Project version: $PROJECT_VER"
          if [[ "$TAG_VER" != "$PROJECT_VER" ]]; then
            echo "::error::Tag ($TAG_VER) does not match pyproject.toml version ($PROJECT_VER)!"
            exit 1
          fi

      - name: Clean and Build
        run: |
          rm -rf dist/
          uv build

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

      - name: Check if Pre-release
        id: check_pre
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if [[ "$VERSION" =~ [._-]?(a|b|rc|alpha|beta|dev)[0-9]*$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Release Notes
        id: notes
        run: |
          MSG="$(git log -1 --pretty=%s)"
          if [[ "$MSG" == "chore: update geetest config to "* ]]; then
            GEETEST_VER="${MSG#chore: update geetest config to }"
            GEETEST_VER="${GEETEST_VER% [auto]}"
            echo "body=Config updated to Geetest $GEETEST_VER" >> "$GITHUB_OUTPUT"
          else
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          prerelease: ${{ steps.check_pre.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.check_pre.outputs.make_latest == 'true' }}
