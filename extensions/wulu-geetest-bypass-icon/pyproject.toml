[project]
name = "wulu-geetest-bypass-icon"
version = "0.1.1"
description = "Offline YOLO icon-direction solver for Geetest v4 icon captchas"
readme = "README.md"
authors = [{ name = "wulu007", email = "dabaobeix@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "geetest",
    "bypass",
    "captcha",
    "icon",
    "yolo",
    "onnx",
    'wulu-geetest-bypass',
]
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=4.13.0.92",
    "pooch[progress]>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project.entry-points."wulu_geetest_bypass.solvers"]
icon = "wulu_geetest_bypass_icon.solver:solve_icon"

[project.entry-points."wulu_geetest_bypass.fetcher"]
icon = "wulu_geetest_bypass_icon.hub:get_fetcher"

[project.urls]
Homepage = "https://github.com/wulu007/geetest-bypass"
Documentation = "https://github.com/wulu007/geetest-bypass#readme"
Repository = "https://github.com/wulu007/geetest-bypass.git"
Issues = "https://github.com/wulu007/geetest-bypass/issues"
