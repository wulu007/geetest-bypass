[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wulu-geetest-bypass-nine"
version = "0.1.0"
description = "Nine-grid (3x3) solver using convnextv2_femto embeddings for wulu-geetest-bypass"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wulu007", email = "dabaobeix@gmail.com" }]
keywords = [
    "geetest",
    "bypass",
    "captcha",
    "nine",
    "convnext",
    "wulu-geetest-bypass",
]
dependencies = [
    "timm>=1.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "wulu-geetest-bypass",
]

[project.entry-points."wulu_geetest_bypass.solvers"]
nine = "wulu_geetest_bypass_nine.solver:solve_nine"

[project.urls]
Homepage = "https://github.com/wulu007/geetest-bypass"
Documentation = "https://github.com/wulu007/geetest-bypass#readme"
Repository = "https://github.com/wulu007/geetest-bypass.git"
Issues = "https://github.com/wulu007/geetest-bypass/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wulu_geetest_bypass_nine"]
