[project]
name = "wulu-geetest-bypass-word"
version = "0.1.0"
description = "Word CAPTCHA solver for Geetest v4 using YOLO detection and Siamese icon matching"
readme = "README.md"
authors = [{ name = "wulu007", email = "dabaobeix@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "geetest",
    "bypass",
    "captcha",
    "captcha-solver",
    "word",
    "yolo",
    'wulu-geetest-bypass',
]
dependencies = []

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"


[tool.pyrefly]
search = ["src"]
