[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["extensions/*"]

[project]
name = "wulu-geetest-bypass"
version = "0.4.1"
description = "Pure Python Geetest v4 CAPTCHA solver with human-like track simulation, no Node.js or browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.23.0", "smcryptopy>=0.2.1", "wreq>=0.12.0"]
license = { text = "MIT" }
authors = [{ name = "wulu007", email = "dabaobeix@gmail.com" }]
keywords = [
    "geetest",
    "bypass",
    "captcha",
    "captcha-solver",
    "reverse-engineering",
    "pow",
    'crack',
]

[project.urls]
Homepage = "https://github.com/wulu007/geetest-bypass"
Documentation = "https://github.com/wulu007/geetest-bypass#readme"
Repository = "https://github.com/wulu007/geetest-bypass.git"
Issues = "https://github.com/wulu007/geetest-bypass/issues"

[project.optional-dependencies]
voice = ["wulu-geetest-bypass-voice>=0.1.2"]
svg = ["pillow>=12.2.0", "resvg-py>=0.3.2", "wulu-geetest-bypass[image]"]
slide = ["wulu-geetest-bypass[image]"]
image = ["opencv-python-headless>=4.13.0.92"]
icon = ["wulu-geetest-bypass-icon"]
all = ["wulu-geetest-bypass[voice,slide,svg,icon]"]

[project.scripts]
wulu-geetest = "wulu_geetest_bypass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wulu_geetest_bypass"]
exclude = ["tests/", "scripts/", "src/wulu_geetest_bypass/data/*.json"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv.sources]
wulu-geetest-bypass = { workspace = true }
wulu-geetest-bypass-voice = { workspace = true }
wulu-geetest-bypass-icon = { workspace = true }

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B008", "RUF002", "RUF001"]
fixable = ['ALL']

[tool.ruff.lint.isort]
force-single-line = false
relative-imports-order = "closest-to-furthest"
split-on-trailing-comma = true

[tool.pytest.ini_options]
addopts = "-s"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
search-path = [
    "src",
    "extensions/wulu-geetest-bypass-voice/src",
    "extensions/wulu-geetest-bypass-icon/src",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "faster-whisper>=1.2.1",
    "wulu-geetest-bypass[all]",
    "pyrefly>=1.2.0",
    "ruff==0.16.4",
]
